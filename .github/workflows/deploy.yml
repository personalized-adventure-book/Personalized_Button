name: Deploy to GitHub Pages

on:
  push:
    branches:
      - ai_main_239d030b9800

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # Fetch full history so we can checkout other branches

      - name: Fetch JSONs from main branch
        run: |
          git fetch origin ai_main_239d030b9800
          git checkout origin/ai_main_239d030b9800 -- content

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Export Static Site
        run: SKIP_CONTENT_COPY=0 npm run export

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./out
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
