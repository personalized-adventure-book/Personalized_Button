name: 🪄 Deploy to GitHub Pages

# ← this is what your error was complaining about!
on:
  push:
    branches:
      - main        # ← or whatever branch you deploy from

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - run: npm ci

      - name: Build & Export
        run: npm run export

      - name: Upload `out/` as Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-export
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
